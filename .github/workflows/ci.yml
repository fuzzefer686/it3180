name: CI
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          CI: 'true'
          SUPABASE_TELEMETRY_DISABLED: '1'
          SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
      - name: Stop local Supabase
        if: always()
        run: npx --no-install supabase stop
# GitHub Actions chỉ kiểm tra; frontend Pages deploy qua kết nối Git trên Dashboard.
